[workspace]
resolver = "2"
members = ["core", "cli", "gui/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.75"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
